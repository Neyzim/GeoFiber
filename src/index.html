<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>GeoFiber — Mapeador de redes FTTH</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet"
  >
  <script>
    // Aplica o tema salvo antes do Angular carregar (evita o "flash" claro).
    // Chave em `THEME_STORAGE_KEY` (map.constants.ts).
    (function () {
      try {
        var stored = localStorage.getItem('geofiber.theme.v1');
        var dark = stored
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) {
          document.documentElement.classList.add('dark-theme');
        }
      } catch (error) {
        /* sem armazenamento: mantém o tema claro */
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
