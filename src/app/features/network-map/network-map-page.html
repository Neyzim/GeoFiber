<div class="project">
  <!-- Painel lateral: identidade, busca, filtros e listas -->
  <app-network-sidebar
    class="project__sidebar"
    [activeTool]="activeTool()"
    [pins]="pins()"
    [selectedPinId]="selectedId()"
    [cables]="cables()"
    [selectedCableId]="selectedCableId()"
    [totalPins]="totalPins()"
    [totalCables]="totalCables()"
    [search]="search()"
    [activeStatuses]="activeStatuses()"
    [hasActiveFilters]="hasActiveFilters()"
    (searchChange)="onSearchChange($event)"
    (clearSearch)="clearSearch()"
    (statusChange)="onStatusFilterChange($event)"
    (clearFilters)="clearFilters()"
    (pinSelect)="zoomToPin($event)"
    (pinEdit)="editPin($event)"
    (pinRemove)="removePin($event)"
    (cableSelect)="zoomToCable($event)"
    (cableEdit)="editCable($event)"
    (cableRemove)="removeCable($event)"
  />

  <!-- Área do mapa com barras flutuantes -->
  <main class="project__map-area">
    <app-geo-map
      class="project__map"
      [initialCenter]="initialCenter()"
      [initialZoom]="initialZoom()"
      [pins]="pins()"
      [selectedPinId]="selectedId()"
      [paths]="paths()"
      [selectedPathId]="selectedCableId()"
      [draftOrigin]="draftOrigin()"
      [previewColor]="previewColor()"
      [activeTool]="activeTool()"
      [baseLayerKey]="preferencesState.baseLayerKey()"
      [baseLayerOpacity]="preferencesState.baseLayerOpacity()"
      (mapClick)="onMapClick($event)"
      (mapDoubleClick)="onMapDoubleClick()"
      (pinClick)="onPinClick($event)"
      (pinDoubleClick)="onPinDoubleClick()"
      (pathClick)="onPathClick($event)"
      (pathVertexMoved)="onPathVertexMoved($event)"
      (pinMoved)="onPinMoved($event)"
      (pointerMove)="onPointerMove($event)"
      (viewChanged)="onViewChanged($event)"
      (located)="onLocated($event)"
    />

    <div class="project__overlay project__overlay--left">
      <app-map-toolbar
        [activeTool]="activeTool()"
        [showLayerPanel]="showLayerPanel()"
        [showLegend]="preferencesState.showLegend()"
        [visibleCount]="visibleCount()"
        (toolChange)="setTool($event)"
        (zoomIn)="zoomIn()"
        (zoomOut)="zoomOut()"
        (locate)="locate()"
        (fitToPins)="fitToPins()"
        (toggleLayerPanel)="toggleLayerPanel()"
        (toggleLegend)="toggleLegend()"
        (clearAll)="clearAll()"
      />

      @if (showPicker() && activeTool() === 'addPin') {
        <app-map-type-picker
          title="Tipo de PIN"
          hint="Escolha o elemento e clique no mapa."
          [options]="pinTypeOptions()"
          [activeKey]="activePinType()"
          (pick)="onPinTypePicked($event)"
          (close)="closePicker()"
        />
      }

      @if (showPicker() && activeTool() === 'addCable') {
        <app-map-type-picker
          title="Tipo de cabo"
          hint="Clique no mapa para traçar e finalize com duplo clique."
          sample="cable"
          [options]="cableTypeOptions()"
          [activeKey]="activeCableType()"
          (pick)="onCableTypePicked($event)"
          (close)="closePicker()"
        />
      }
    </div>

    <div class="project__overlay project__overlay--right">
      @if (showLayerPanel()) {
        <app-map-layer-panel
          [layers]="baseLayers"
          [activeKey]="preferencesState.baseLayerKey()"
          [opacity]="preferencesState.baseLayerOpacity()"
          (layerChange)="onBaseLayerChange($event)"
          (opacityChange)="onOpacityChange($event)"
          (close)="toggleLayerPanel()"
        />
      }
      @if (preferencesState.showLegend()) {
        <app-map-legend
          [pinItems]="legendPinItems()"
          [cableItems]="legendCableItems()"
          [totalPins]="totalPins()"
          [totalCables]="totalCables()"
          (toggleItem)="onLegendToggle($event)"
          (close)="toggleLegend()"
        />
      }
    </div>

    <app-map-status-bar
      class="project__status-bar"
      [pointer]="pointer()"
      [view]="view()"
      [totalPins]="totalPins()"
      [visiblePins]="visibleCount()"
      [totalCables]="totalCables()"
      [visibleCables]="cables().length"
      [activeTool]="activeTool()"
    />
  </main>
</div>
