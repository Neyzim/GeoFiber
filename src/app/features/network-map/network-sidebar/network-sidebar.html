<aside class="sidebar" [class.is-collapsed]="collapsed()">
  @if (collapsed()) {
    <div class="sidebar__rail">
      <button
        mat-icon-button
        type="button"
        matTooltip="Expandir painel"
        matTooltipPosition="right"
        (click)="toggleCollapsed()"
      >
        <mat-icon>chevron_right</mat-icon>
      </button>
      <span class="sidebar__logo" aria-hidden="true">GF</span>
      <a
        mat-icon-button
        routerLink="/modelos"
        matTooltip="Modelos de rede"
        matTooltipPosition="right"
      >
        <mat-icon>category</mat-icon>
      </a>
      <button
        mat-icon-button
        type="button"
        [matTooltip]="isDark() ? 'Modo claro' : 'Modo escuro'"
        matTooltipPosition="right"
        (click)="toggleTheme()"
      >
        <mat-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    </div>
  } @else {
    <header class="sidebar__brand">
      <span class="sidebar__logo" aria-hidden="true">GF</span>
      <span class="sidebar__brand-text">
        <strong>GeoFiber</strong>
        <small>Mapeador de redes FTTH</small>
      </span>
      <button
        mat-icon-button
        type="button"
        class="sidebar__collapse"
        matTooltip="Recolher painel"
        (click)="toggleCollapsed()"
      >
        <mat-icon>chevron_left</mat-icon>
      </button>
    </header>

    @if (isCreating()) {
      <p class="sidebar__hint">
        <mat-icon>keyboard</mat-icon>
        Clique no mapa para criar. Pressione <kbd>ESC</kbd> para sair da ferramenta.
      </p>
    }

    <nav class="sidebar__nav">
      <a routerLink="/modelos" class="sidebar__nav-item">
        <mat-icon>category</mat-icon>
        <span class="sidebar__nav-text">
          <strong>Modelos de rede</strong>
          <small>Tipos de cabo, CTO e CEO</small>
        </span>
        <mat-icon class="sidebar__nav-arrow">chevron_right</mat-icon>
      </a>
    </nav>

    <footer class="sidebar__footer">
      <button
        mat-stroked-button
        type="button"
        class="sidebar__theme"
        (click)="toggleTheme()"
      >
        <mat-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
        {{ isDark() ? 'Modo claro' : 'Modo escuro' }}
      </button>
    </footer>
  }
</aside>
