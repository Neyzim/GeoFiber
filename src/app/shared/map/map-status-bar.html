<div class="status-bar">
  <span class="status-bar__item status-bar__item--coords">
    <span class="status-bar__label">Cursor</span>
    <span class="status-bar__value">{{ pointer() | coordinate: 'decimal': 6 }}</span>
  </span>

  <span class="status-bar__item">
    <span class="status-bar__label">Centro</span>
    <span class="status-bar__value">{{ view()?.center | coordinate: 'dms' }}</span>
  </span>

  <span class="status-bar__item">
    <span class="status-bar__label">Zoom</span>
    <span class="status-bar__value">{{ view()?.zoom ?? '—' }}</span>
  </span>

  <span class="status-bar__item">
    <span class="status-bar__label">Ferramenta</span>
    <span class="status-bar__value">{{ toolLabel() }}</span>
  </span>

  <span class="status-bar__item">
    <span class="status-bar__label">PINs</span>
    <span class="status-bar__value">{{ visiblePins() }} / {{ totalPins() }}</span>
  </span>

  <span class="status-bar__item">
    <span class="status-bar__label">Cabos</span>
    <span class="status-bar__value">{{ visibleCables() }} / {{ totalCables() }}</span>
  </span>

  <span class="status-bar__item status-bar__item--crs">
    <span class="status-bar__label">CRS</span>
    <span class="status-bar__value">{{ crs() }}</span>
  </span>
</div>
